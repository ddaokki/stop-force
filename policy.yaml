# Stop-Force simulator policy. This is not an OpenShell sandbox configuration.
# Parse the entire command first; the simulator and policy share the same operation.
version: 2
default: deny
operations:
  list: {action: allow, reason: 서비스 목록 조회}
  logs: {action: allow, reason: 등록된 서비스 로그 조회}
  disk: {action: allow, reason: 허용된 마운트 용량 조회}
  db_activity: {action: allow, reason: 고정된 DB 활동 조회}
  read_file: {action: allow, reason: 합성 설정 조회 후 비밀 가림}
  status: {action: allow, reason: 서비스 상태 조회}
  history: {action: allow, reason: 배포 버전 조회}
  restart: {action: allow, reason: 등록된 서비스 재시작}
  undo: {action: approval, reason: 배포 버전 변경}
  scale: {action: approval, reason: 1~10 replica 용량 변경}
  kill_idle: {action: approval, reason: idle 트랜잭션 종료}
  clean_logs: {action: approval, reason: 지정 경로의 7일 초과 압축 로그 정리}
  restore_rotation: {action: approval, reason: 로그 로테이션 스케줄 복원}
  destroy: {action: deny, reason: 데이터 파괴 금지}

# Redaction is always active, independently of command policy ON/OFF.
redact:
  - name: password
    pattern: '(?i)["'']?(?:[a-z0-9_]*password|passwd|pwd)["'']?[ \t]*[:=][ \t]*(?!\[REDACTED:)(?:"(?:\\.|[^"\\\r\n])*"|''(?:\\.|[^''\\\r\n])*''|[^\s,}\]]+(?:[ \t]+(?![\w.-]+[ \t]*[:=]|\[REDACTED:)[^\s,}\]]+)*)'
  - name: stripe_key
    pattern: 'sk_live_[A-Za-z0-9]+'
  - name: aws_key
    pattern: 'AKIA[0-9A-Z]{16}'
  - name: bearer
    pattern: '(?i)bearer\s+[A-Za-z0-9._-]+'

  - name: nvidia_key
    pattern: 'nvapi-[A-Za-z0-9_-]+'
